# Grids labelled crossword, checked against the full page.

[puzzle."games1987-06-01c"]
title = "1924 Test of Wits"
author = "F. Gregory Hartswick"
note = "Reprint of a puzzle from the world's first crossword contest (1924). GAMES: 'This recently discovered puzzle appeared in the world's first crossword contest (see box)'; the box is headed 'Could You Have Been Crossword Champion of the World?'."

# Siamese Twins: two grids, and each clue number has two clues with different
# answers; the solver decides which grid each answer goes in. To do: split into
# two puzzles, each clue paired with the answer it fits (from the answer key).
[puzzle."games1983-05-01c"]
note = "Printed as 'Siamese Twins': two grids for the price of one, each clue number followed by two different clues; the solver decides which grid each answer belongs in."


# Fixes for the games harvest. See docs/fixing.md.
#
# Puzzle fixes are keyed by xd id (shown on each review page):
#   [puzzle."gamesYYYY-MM-DD"]
#   title = "..."
#   [puzzle."gamesYYYY-MM-DD".clues]
#   A1 = "..."
#
# Page hints are keyed by archive.org item and page (leaf):
#   [page."<identifier>".34]
#   clue_page = 33

# ---------------------------------------------------------------------------
# Puzzle editor. GAMES credits no editor on individual puzzles, but Will
# Shortz edited its Pencilwise puzzle pages (crosswords and word puzzles).
# GAMES itself, May/June 1981: "Will Shortz, of the 'Pencilwise' puzzle pages
# in GAMES". He's credited on every issue from his first to his last masthead
# appearance; each puzzle's Editor-Source header says so.
# ---------------------------------------------------------------------------
[[editor_rule]]
editor = "Will Shortz"
masthead_pattern = 'Will\s+Sh[o0]r[tli1][zs2]'
basis = "Shortz edited the Pencilwise puzzle pages (GAMES, May/June 1981: 'Will Shortz, of the Pencilwise puzzle pages in GAMES')"

